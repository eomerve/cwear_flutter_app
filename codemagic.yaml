
workflows:
  flutter-ios-device:
    name: Flutter iOS Device IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS Release
        script: flutter build ios --release --no-codesign

      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          mkdir -p build/ios/ipa
          /usr/bin/zip -r build/ios/ipa/Runner.ipa Payload
          rm -rf Payload

    artifacts:
      - build/ios/ipa/*.ipa
